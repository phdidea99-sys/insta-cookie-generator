<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Cookie Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .example {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 20px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
            width: 100%;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }
        .status {
            text-align: center;
            margin: 10px 0;
            color: #666;
            font-size: 14px;
        }
        .download-btn {
            background: #4CAF50;
            display: none;
            margin-top: 20px;
        }
        .download-btn:hover {
            background: #45a049;
        }
        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        code {
            background: #f1f1f1;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍪 Instagram Cookie Generator</h1>
        
        <div class="warning">
            <strong>⚠️ সতর্কতা:</strong> 
            শুধু টেস্ট একাউন্ট ব্যবহার করুন। আসল একাউন্ট ব্লক হওয়ার ঝুঁকি আছে।
        </div>
        
        <div class="example">
            <strong>📝 ইনপুট ফরম্যাট (প্রতি লাইনে):</strong><br>
            <code>username|password</code><br><br>
            <strong>উদাহরণ:</strong><br>
            <code>testuser1|pass123<br>testuser2|pass456<br>testuser3|pass789</code>
        </div>
        
        <textarea id="inputData" placeholder="user1|pass1&#10;user2|pass2&#10;user3|pass3"></textarea>
        
        <button id="submitBtn" onclick="generateCookies()">🚀 কুকি জেনারেট করুন</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status" id="statusText">প্রসেসিং শুরু হচ্ছে...</div>
            <div class="error-message" id="errorText"></div>
        </div>
        
        <button class="download-btn" id="downloadBtn">📥 ফাইল ডাউনলোড করুন</button>
        
        <div class="footer">
            ⚡ ফোন ভার্সন ২.০ | Render.com
        </div>
    </div>

    <script>
        function generateCookies() {
            const inputData = document.getElementById('inputData').value;
            
            if (!inputData.trim()) {
                alert('❌ প্লিজ কিছু ডাটা লিখুন!');
                return;
            }
            
            // প্রোগ্রেস বার দেখান
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('statusText').innerText = 'প্রসেসিং শুরু হচ্ছে...';
            document.getElementById('errorText').innerText = '';
            
            // বাটন ডিজেবল করুন
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('downloadBtn').style.display = 'none';
            
            console.log('Sending data to server...');
            
            // API কল
            fetch('/api/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    credentials: inputData
                })
            })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                
                if (data.error) {
                    document.getElementById('errorText').innerText = 'Error: ' + data.error;
                    document.getElementById('statusText').innerText = '❌ ব্যর্থ';
                    document.getElementById('submitBtn').disabled = false;
                    return;
                }
                
                if (data.job_id) {
                    console.log('Job ID:', data.job_id);
                    // স্ট্যাটাস চেক করা শুরু
                    checkStatus(data.job_id);
                } else {
                    throw new Error('No job ID received');
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                document.getElementById('errorText').innerText = 'কানেকশন error: ' + error.message;
                document.getElementById('statusText').innerText = '❌ error';
                document.getElementById('submitBtn').disabled = false;
            });
        }
        
        function checkStatus(jobId) {
            console.log('Checking status for job:', jobId);
            
            const interval = setInterval(() => {
                fetch(`/api/status/${jobId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Status check failed: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Status data:', data);
                        
                        if (data.error) {
                            clearInterval(interval);
                            document.getElementById('errorText').innerText = 'Error: ' + data.error;
                            document.getElementById('statusText').innerText = '❌ ব্যর্থ';
                            document.getElementById('submitBtn').disabled = false;
                            return;
                        }
                        
                        // প্রোগ্রেস আপডেট
                        if (data.progress !== undefined) {
                            document.getElementById('progressFill').style.width = data.progress + '%';
                            document.getElementById('statusText').innerText = `প্রসেসিং... ${data.progress}%`;
                        }
                        
                        // স্ট্যাটাস চেক
                        if (data.status === 'completed') {
                            clearInterval(interval);
                            document.getElementById('submitBtn').disabled = false;
                            document.getElementById('statusText').innerText = '✅ সম্পন্ন!';
                            document.getElementById('progressFill').style.width = '100%';
                            
                            // ডাউনলোড বাটন দেখান
                            const downloadBtn = document.getElementById('downloadBtn');
                            downloadBtn.style.display = 'block';
                            downloadBtn.onclick = function() {
                                window.location.href = `/api/download/${jobId}`;
                            };
                        }
                        
                        if (data.status === 'error') {
                            clearInterval(interval);
                            document.getElementById('submitBtn').disabled = false;
                            document.getElementById('statusText').innerText = '❌ error হয়েছে';
                            document.getElementById('errorText').innerText = data.error || 'অজানা error';
                        }
                    })
                    .catch(error => {
                        console.error('Status check error:', error);
                        // error হলে interval বন্ধ না করে চালিয়ে যান
                        document.getElementById('errorText').innerText = 'স্ট্যাটাস চেক error: ' + error.message;
                    });
            }, 2000);
        }
    </script>
</body>
</html>
